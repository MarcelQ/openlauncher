name: Build and publish debug APK

# Every push and PR builds the debug APK and runs the JVM unit tests.
# Pushes to dev/main additionally update a rolling prerelease so the APK can be
# downloaded straight onto a head unit. APKs are debug-signed only — they are
# for bench testing, not distribution.

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode shared debug keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            mkdir -p keystore
            printf '%s' "$DEBUG_KEYSTORE_B64" | base64 -d > keystore/debug.keystore
            echo "shared debug keystore restored (all builds share one signing key)"
          else
            echo "::warning::DEBUG_KEYSTORE_B64 secret not set - APK signed with throwaway runner key; updates will not install over older builds"
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/dists
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/**', 'gradle/gradle-daemon-jvm.properties', 'gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Unit tests + debug APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Upload unit-test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report-${{ github.ref_name }}
          path: app/build/reports/tests
          if-no-files-found: ignore

      - name: Upload APK as workflow artifact (any branch)
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.ref_name }}-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Update rolling prerelease (dev/main pushes only)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/dev" ]; then
            TAG=dev-latest
            ASSET=openlauncher-dev-debug.apk
            DESC='Rolling debug build of the integration branch `dev` at the current tip. Debug-signed, bench testing only. Installing this makes OpenLauncher a HOME candidate on the head unit; revert with `adb shell cmd package set-home-activity <previous launcher>`.'
          else
            TAG=main-latest
            ASSET=openlauncher-main-debug.apk
            DESC='Debug-signed build of the stable branch `main` at the current tip. Debug-signed, bench testing only. Installing this makes OpenLauncher a HOME candidate on the head unit; revert with `adb shell cmd package set-home-activity <previous launcher>`.'
          fi
          # Version marker the in-app updater parses (UpdateChecker.kt). Keep the
          # `versionCode=N versionName=X commit=<sha>` line format in sync with it.
          VER_LINE=$(./gradlew -q printVersionInfo)
          NOTES="$DESC
          $VER_LINE commit=$GITHUB_SHA"
          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --prerelease --target "$GITHUB_SHA" --title "$TAG (rolling)" --notes "$NOTES"
          gh release edit "$TAG" --target "$GITHUB_SHA" --prerelease --title "$TAG (rolling)" --notes "$NOTES"
          gh release upload "$TAG" "$ASSET" --clobber
